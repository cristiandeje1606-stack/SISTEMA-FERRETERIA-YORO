// ---------- texto ----------
function font(sz,o={}){return`${o.w||800} ${sz}px ${o.f||'Archivo'}`}

function tokens(t){const out=[];let hl=false;t.split(/(\*)/).forEach(p=>{if(p==='*'){hl=!hl;return}p.split(/(\s+)/).forEach(w=>{if(w&&!/^\s+$/.test(w))out.push({w,hl})})});return out}
function wrap(toks,sz,maxw,o){const sp=mw(' ',sz,o);const lines=[];let cur=[],cw=0;toks.forEach(tk=>{const w=mw(tk.w,sz,o);if(cur.length&&cw+sp+w>maxw){lines.push(cur);cur=[];cw=0}cur.push({...tk,wd:w});cw+=(cur.length>1?sp:0)+w});if(cur.length)lines.push(cur);return{lines,sp}}

    X.save();X.beginPath();X.rect(x+16*U,y+16*U,w-32*U,h-(c.zn?150:60)*U);X.clip();cover(c.gris?gris(c.img):im,x+16*U,y+16*U,w-32*U,h-(c.zn?150:60)*U,1.04+.05*P(t,c.t0,c.d));X.restore();

function fechaTag(c,t,x,y){if(!c.fecha&&!c.tag)return y;let yy=y;const a=ex(P(t,c.t0+.05,.4));X.save();X.globalAlpha=a;

// ---------- tipos de carta ----------
function cTexto(c,t){

    X.save();X.beginPath();X.rect(W/2-m/2-40*U,y2-s2,(m+80*U)*p,s2*1.4);X.clip();X.fillStyle=EXP?'#B3121D':K.rojo;X.save();X.translate(W/2,y2-s2*.3);X.transform(1,0,-.12,1,0,0);X.fillRect(-m/2-34*U,-s2*.7,m+68*U,s2*1.32);X.restore();

function cContador(c,t){const box=L.txtW;if(EXP)hoja(box,t,c);const p=ss(P(t,c.t0+.1,1.1));
