<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bang;src:url(fonts/bangers-latin-400-normal.woff2)}
@font-face{font-family:Luck;src:url(fonts/luckiest-guy-latin-400-normal.woff2)}
@font-face{font-family:Archivo;src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Neue;src:url(fonts/comic-neue-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script>
// Estilo 18 · Cómic Pop (catálogo PROAUDIH) para UNE Visión
const Q=new URLSearchParams(location.search);const M=+Q.get('m')||1,W=+Q.get('w')||1920,H=+Q.get('h')||1080;
const cv=document.getElementById('c');cv.width=W;cv.height=H;const X=cv.getContext('2d');
const TV=W>H,U=Math.min(W,H)/1080,CX=W/2,CY=H/2,DG=Math.hypot(W,H);
const C={am:'#FFE600',ro:'#FF2D55',az:'#00A8E8',ti:'#111111',bl:'#FFFFFF',cian:'#08E1FF',naranja:'#F6901C',marino:'#0B2238'};
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),P=(t,a,d)=>cl((t-a)/d);
const ex=x=>{x=cl(x);return x>=1?1:1-Math.pow(2,-10*x)},ss=x=>{x=cl(x);return x*x*(3-2*x)};
const bk=(x,s=1.8)=>{x=cl(x);const c3=s+1;return 1+c3*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const el=x=>{x=cl(x);if(x===0||x===1)return x;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};
const hs=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const L=(a,b)=>TV?a:b;
const LOGO=new Image();LOGO.src='logo.png';const LG={};
function prep(){const mk=f=>{const c=document.createElement('canvas');c.width=LOGO.width;c.height=LOGO.height;const x=c.getContext('2d');x.drawImage(LOGO,0,0);x.globalCompositeOperation='source-in';x.fillStyle=f;x.fillRect(0,0,c.width,c.height);return c};LG.w=mk('#fff');LG.k=mk('#111');LG.n=mk('#0B2238')}
// ---------- piezas de cómic ----------
function rays(cx,cy,n,c1,c2,rot){X.fillStyle=c1;X.fillRect(0,0,W,H);X.fillStyle=c2;X.beginPath();for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;X.moveTo(cx,cy);X.arc(cx,cy,DG,a,a+Math.PI/n)}X.fill()}
function dots(x,y,w,h,col,step,rmax,dir=0){X.save();X.beginPath();X.rect(x,y,w,h);X.clip();X.fillStyle=col;X.beginPath();
  for(let j=0,yy=y;yy<y+h+step;yy+=step*.866,j++)for(let xx=x+(j%2?step/2:0);xx<x+w+step;xx+=step){
    let f=dir===0?(xx-x)/w:dir===1?1-(xx-x)/w:dir===2?(yy-y)/h:dir===3?1-(yy-y)/h:Math.hypot(xx-CX,yy-CY)/(DG/2);
    const r=rmax*cl(f);if(r>.6){X.moveTo(xx+r,yy);X.arc(xx,yy,r,0,7)}}X.fill();X.restore()}
function focus(cx,cy,r0,k,col='#fff',n=70,seed=0){if(k<=0)return;X.save();X.fillStyle=col;X.globalAlpha=k;for(let i=0;i<n;i++){const a=hs(i+seed)*Math.PI*2,w=(.006+hs(i+seed+40)*.014);const r=r0*(.9+hs(i+seed+80)*.5);
  X.beginPath();X.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);X.lineTo(cx+Math.cos(a-w)*DG,cy+Math.sin(a-w)*DG);X.lineTo(cx+Math.cos(a+w)*DG,cy+Math.sin(a+w)*DG);X.fill()}X.restore()}
function starPath(cx,cy,r,n,seed,inner=.68,nb=false){if(!nb)X.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2;const rr=i%2?r*(inner+hs(i+seed)*.08):r*(.92+hs(i+seed+9)*.16);const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?X.lineTo(x,y):X.moveTo(x,y)}X.closePath()}
function burst(cx,cy,r,fill,seed=1,n=14,o={}){if(r<=1)return;X.save();X.lineJoin='round';
  X.translate(10*U,12*U);starPath(cx,cy,r,n,seed);X.fillStyle=C.ti;X.fill();X.translate(-10*U,-12*U);
  starPath(cx,cy,r,n,seed);X.fillStyle=fill;X.fill();X.lineWidth=(o.lw||9)*U;X.strokeStyle=C.ti;X.stroke();
  if(o.in){starPath(cx,cy,r*.78,n,seed+3);X.fillStyle=o.in;X.fill()}X.restore()}
// texto con tinta 3D (extrusión negra) y contorno
function ink(s,x,y,sz,o={}){X.save();X.translate(x,y);if(o.rot)X.rotate(o.rot);if(o.sk)X.transform(1,0,o.sk,1,0,0);if(o.sc)X.scale(o.sc,o.sc);
  X.font=`${o.w||400} ${sz}px ${o.f||'Bang'}`;X.textAlign=o.al||'center';X.textBaseline='middle';if(o.ls)X.letterSpacing=o.ls+'px';X.lineJoin='round';
  const d=o.d===undefined?12:o.d;for(let i=d;i>=1;i--){X.fillStyle=C.ti;X.fillText(s,i*.8*U,i*U)}
  X.lineWidth=(o.lw||12)*U;X.strokeStyle=C.ti;X.strokeText(s,0,0);
  if(o.grad){const g=X.createLinearGradient(0,-sz/2,0,sz/2);o.grad.forEach((c,i)=>g.addColorStop(i/(o.grad.length-1),c));X.fillStyle=g}else X.fillStyle=o.c||C.bl;X.fillText(s,0,0);
  if(o.hi){X.save();X.clip?0:0;X.globalAlpha=.55;X.fillStyle='#fff';X.fillText(s,-3*U,-4*U);X.restore();X.fillStyle=o.c||C.bl;X.globalAlpha=.6;X.fillText(s,0,0)}
  X.restore()}
function mw(s,sz,f='Bang',ls=0){X.save();X.font=`400 ${sz}px ${f}`;if(ls)X.letterSpacing=ls+'px';const m=X.measureText(s).width;X.restore();return m}
const fit=(s,maxW,max,f='Bang')=>Math.min(max,maxW/mw(s,100,f)*100);
// viñeta: entra con zoom/golpe; contenido recortado
function panel(t,t0,x,y,w,h,from,inner,o={}){const p=t0===null?1:P(t,t0,.45);if(p<=0)return;const e=bk(p,1.6);
  const dx=from==='l'?-(1-e)*W:from==='r'?(1-e)*W:0,dy=from==='t'?-(1-e)*H:from==='b'?(1-e)*H:0,sc=from==='z'?.2+.8*e:1;
  X.save();X.translate(x+w/2+dx,y+h/2+dy);X.rotate((o.rot||0)*(from==='z'?e:1));X.scale(sc,sc);
  X.fillStyle=C.ti;X.fillRect(-w/2+12*U,-h/2+14*U,w,h);
  X.save();X.beginPath();X.rect(-w/2,-h/2,w,h);X.clip();X.translate(-w/2,-h/2);inner(w,h);X.restore();
  X.lineWidth=10*U;X.strokeStyle=C.ti;X.strokeRect(-w/2,-h/2,w,h);X.restore()}
// globo de diálogo
function bubble(t,t0,x,y,w,h,tx,ty,lines,sz,o={}){const p=P(t,t0,.35);if(p<=0)return;const e=el(p);X.save();X.translate(x,y);X.scale(e,e);X.lineJoin='round';
  const shape=()=>{X.beginPath();if(o.shout){const n=22;for(let i=0;i<n*2;i++){const a=i*Math.PI/n;const k=i%2?.86:1.06+hs(i)*.08;const px=Math.cos(a)*w/2*k,py=Math.sin(a)*h/2*k;i?X.lineTo(px,py):X.moveTo(px,py)}X.closePath()}
    else X.ellipse(0,0,w/2,h/2,0,0,7);const bx=tx-x,by=ty-y;const a=Math.atan2(by,bx);X.moveTo(Math.cos(a-.25)*w*.36,Math.sin(a-.25)*h*.36);X.lineTo(bx,by);X.lineTo(Math.cos(a+.25)*w*.36,Math.sin(a+.25)*h*.36)};
  X.save();X.translate(9*U,11*U);shape();X.fillStyle=C.ti;X.fill();X.restore();shape();X.fillStyle=o.bg||'#fff';X.fill();X.lineWidth=8*U;X.strokeStyle=C.ti;X.stroke();
  X.fillStyle=o.bg||'#fff';X.beginPath();X.ellipse(0,0,w/2-6*U,h/2-6*U,0,0,7);X.fill();
  X.fillStyle=o.c||C.ti;X.font=`${o.f==='Bang'?400:700} ${sz}px ${o.f||'Neue'}`;X.textAlign='center';X.textBaseline='middle';lines.forEach((s,i)=>X.fillText(s,0,(i-(lines.length-1)/2)*sz*1.08));X.restore()}
// recuadro de narración (amarillo)
function caption(t,t0,x,y,s,sz,o={}){const p=P(t,t0,.3);if(p<=0)return;const e=bk(p,2);X.save();X.translate(x,y);X.rotate(o.rot||-.03);X.scale(1,e);
  X.font=`700 ${sz}px Neue`;const m=X.measureText(s).width,pw=m+sz*1.2,ph=sz*1.7;const ox=o.al==='l'?pw/2:0;
  X.fillStyle=C.ti;X.fillRect(-pw/2+ox+8*U,-ph/2+10*U,pw,ph);X.fillStyle=o.bg||C.am;X.fillRect(-pw/2+ox,-ph/2,pw,ph);X.lineWidth=7*U;X.strokeStyle=C.ti;X.strokeRect(-pw/2+ox,-ph/2,pw,ph);
  X.fillStyle=o.c||C.ti;X.textAlign='center';X.textBaseline='middle';X.fillText(s,ox,sz*.05);X.restore()}
// logo como calcomanía con contorno blanco y tinta
function logoSticker(cx,cy,w,rot=0,sc=1){const h=w*LOGO.height/LOGO.width;X.save();X.translate(cx,cy);X.rotate(rot);X.scale(sc,sc);
  for(let i=14;i>=1;i--)X.drawImage(LG.k,-w/2+i*.9*U,-h/2+i*U,w,h);
  const o2=22*U,o=13*U;for(let k=0;k<20;k++){const a=k/20*Math.PI*2;X.drawImage(LG.w,-w/2+Math.cos(a)*o2,-h/2+Math.sin(a)*o2,w,h)}for(let k=0;k<20;k++){const a=k/20*Math.PI*2;X.drawImage(LG.n,-w/2+Math.cos(a)*o,-h/2+Math.sin(a)*o,w,h)}
  X.globalCompositeOperation='source-over';X.drawImage(LOGO,-w/2,-h/2,w,h);X.restore()}
// mascota: televisor de caricatura
function tele(cx,cy,s,t,o={}){X.save();X.translate(cx,cy);X.scale(s,s);X.lineJoin='round';X.lineCap='round';const k=U;
  const bw=380*k,bh=290*k;// antenas
  X.lineWidth=9*k;X.strokeStyle=C.ti;const wob=Math.sin(t*9)*.12;X.beginPath();X.moveTo(-20*k,-bh/2);X.lineTo(-110*k+wob*90*k,-bh/2-120*k);X.moveTo(20*k,-bh/2);X.lineTo(110*k-wob*90*k,-bh/2-120*k);X.stroke();
  [[-110+wob*90,C.ro],[110-wob*90,C.az]].forEach(([x,c])=>{X.beginPath();X.arc(x*k,-bh/2-125*k,17*k,0,7);X.fillStyle=c;X.fill();X.lineWidth=7*k;X.stroke()});
  // patitas
  X.lineWidth=11*k;X.beginPath();X.moveTo(-100*k,bh/2);X.lineTo(-125*k,bh/2+55*k);X.moveTo(100*k,bh/2);X.lineTo(125*k,bh/2+55*k);X.stroke();
  // cuerpo
  const rr=(x,y,w,h,r)=>{X.beginPath();X.roundRect(x,y,w,h,r)};X.save();X.translate(12*k,14*k);rr(-bw/2,-bh/2,bw,bh,48*k);X.fillStyle=C.ti;X.fill();X.restore();
  rr(-bw/2,-bh/2,bw,bh,48*k);X.fillStyle=C.am;X.fill();X.lineWidth=10*k;X.stroke();
  dots(-bw/2,bh/6,bw,bh/3,'rgba(255,45,85,.45)',14*k,5*k,2);rr(-bw/2,-bh/2,bw,bh,48*k);X.stroke();
  // pantalla
  const sw=270*k,sh=200*k,sx=-bw/2+30*k,sy=-bh/2+40*k;rr(sx,sy,sw,sh,34*k);X.fillStyle=o.on?'#eafcff':C.marino;X.fill();X.lineWidth=9*k;X.stroke();
  X.save();rr(sx,sy,sw,sh,34*k);X.clip();
  if(o.on){X.drawImage(LOGO,sx+sw/2-95*k,sy+sh/2-84*k,190*k,167*k)}else{
    const blink=(t*1.7)%3<.12?.1:1;const lk=Math.sin(t*2.2)*12*k;
    [[-55,0],[55,0]].forEach(([ex_])=>{X.beginPath();X.ellipse(sx+sw/2+ex_*k,sy+sh*.42,30*k,40*k*blink,0,0,7);X.fillStyle='#fff';X.fill();X.lineWidth=6*k;X.strokeStyle=C.ti;X.stroke();
      X.beginPath();X.arc(sx+sw/2+ex_*k+lk,sy+sh*.45,14*k*blink,0,7);X.fillStyle=C.ti;X.fill()});
    X.beginPath();X.arc(sx+sw/2,sy+sh*.62,(o.talk?28+Math.abs(Math.sin(t*16))*12:30)*k,.15*Math.PI,.85*Math.PI);X.lineWidth=8*k;X.strokeStyle='#fff';X.stroke()}
  X.globalAlpha=.35;X.fillStyle='#fff';X.beginPath();X.ellipse(sx+60*k,sy+40*k,40*k,16*k,-.5,0,7);X.fill();X.restore();
  // perillas
  [[-.25,C.ro],[.25,C.az]].forEach(([f,c],i)=>{X.beginPath();X.arc(bw/2-48*k,(-30+i*70)*k,20*k,0,7);X.fillStyle=c;X.fill();X.lineWidth=7*k;X.strokeStyle=C.ti;X.stroke()});
  X.restore()}
// transición ¡POW!: estallido que tapa y luego se abre desde el centro
function pow(t,T,word,seed,fill=C.am,inner=C.ro){const a=P(t,T-.3,.3),b=P(t,T,.32);if(a<=0||b>=1)return;X.save();
  if(t<T){const r=DG*.95*ex(a)*.75;burst(CX,CY,r,fill,seed,16,{in:inner,lw:12});ink(word,CX,CY,fit(word,r*1.1,L(320,300)*U),{rot:-.08,sc:.6+.4*ex(a),c:C.am,d:14})}
  else{X.beginPath();X.rect(0,0,W,H);starPath(CX,CY,DG*.75*ex(b)+1,16,seed+5,.82,true);X.fillStyle=fill;X.fill('evenodd');X.lineWidth=12*U;X.strokeStyle=C.ti;starPath(CX,CY,DG*.75*ex(b)+1,16,seed+5,.82);X.stroke()}
  X.restore()}
function arrow(x,y,s,col){X.save();X.translate(x,y);X.scale(s,s);X.beginPath();X.moveTo(0,-90*U);X.lineTo(70*U,-10*U);X.lineTo(28*U,-10*U);X.lineTo(28*U,80*U);X.lineTo(-28*U,80*U);X.lineTo(-28*U,-10*U);X.lineTo(-70*U,-10*U);X.closePath();
  X.save();X.translate(8*U,10*U);X.fillStyle=C.ti;X.fill();X.restore();X.fillStyle=col;X.fill();X.lineWidth=7*U;X.lineJoin='round';X.strokeStyle=C.ti;X.stroke();X.restore()}
// ==================== UNE CÓMIC NOTICIAS · motion graphics + cómic ====================
// capa de motion: tipografía Archivo expandida, líneas de luz, anillos, barras con curva expo
function mtxt(s,x,y,sz,o={}){X.save();X.font=`${o.w||900} ${sz}px Archivo`;X.fontStretch='expanded';if(o.ls)X.letterSpacing=o.ls+'px';X.textAlign=o.al||'center';X.textBaseline='middle';
  if(o.glow){X.shadowColor=o.glow;X.shadowBlur=24*U}X.fillStyle=o.c||'#fff';X.fillText(s,x,y);X.restore()}
function mwA(s,sz,ls=0){X.save();X.font=`900 ${sz}px Archivo`;X.fontStretch='expanded';if(ls)X.letterSpacing=ls+'px';const m=X.measureText(s).width;X.restore();return m}
const fitA=(s,maxW,max,ls=0)=>Math.min(max,maxW/mwA(s,100,ls*100/Math.max(1,max))*100);
function grid(t,k){if(k<=0)return;X.save();X.strokeStyle=`rgba(8,225,255,${.09*k})`;X.lineWidth=1.5*U;const st=64*U;
  for(let x=(t*20*U)%st;x<W;x+=st){X.beginPath();X.moveTo(x,0);X.lineTo(x,H*k);X.stroke()}for(let y=0;y<H;y+=st){X.beginPath();X.moveTo(0,y);X.lineTo(W*k,y);X.stroke()}X.restore()}
function rings(cx,cy,r,t,k){if(k<=0)return;X.save();X.globalAlpha=k;X.lineCap='round';
  [[1,1.2,C.cian,[2,16],4],[1.18,-.8,C.am,[60,30],7],[1.36,.5,'rgba(255,255,255,.6)',[6,28],3]].forEach(([f,sp,col,dash,lw])=>{X.setLineDash(dash.map(d=>d*U));X.strokeStyle=col;X.lineWidth=lw*U;X.beginPath();X.arc(cx,cy,r*f,t*sp,t*sp+Math.PI*1.5);X.stroke()});X.setLineDash([]);X.restore()}
function scan(t,t0,k=1){const p=P(t,t0,.6);if(p<=0||p>=1)return;X.save();X.globalCompositeOperation='lighter';const y=H*ex(p);const g=X.createLinearGradient(0,y-80*U,0,y);g.addColorStop(0,'rgba(8,225,255,0)');g.addColorStop(1,`rgba(8,225,255,${.5*k})`);X.fillStyle=g;X.fillRect(0,y-80*U,W,80*U);X.fillStyle='#fff';X.fillRect(0,y-2*U,W,3*U);X.restore()}
// transición híbrida: tres barras de motion (con tinta y trama) cruzan en diagonal
function bars(t,T){const a=P(t,T-.35,.35),b=P(t,T,.35);if(a<=0||b>=1)return;const cols=[C.cian,C.am,C.ro];X.save();X.translate(CX,CY);X.rotate(-.35);
  for(let i=0;i<3;i++){const hgt=DG*.42;const y=(i-1)*hgt*.98;const x0=t<T?(-DG*1.2+DG*1.2*ex(P(t,T-.35+i*.05,.3))):(DG*1.2*ex(P(t,T+i*.05,.3)));
    X.fillStyle=C.ti;X.fillRect(x0-DG*.6+12*U,y-hgt/2+12*U,DG*1.2,hgt);X.fillStyle=cols[i];X.fillRect(x0-DG*.6,y-hgt/2,DG*1.2,hgt);
    X.save();X.beginPath();X.rect(x0-DG*.6,y-hgt/2,DG*1.2,hgt);X.clip();dots(x0-DG*.6,y-hgt/2,DG*1.2,hgt,'rgba(17,17,17,.18)',22*U,8*U,2);X.restore();
    X.lineWidth=10*U;X.strokeStyle=C.ti;X.strokeRect(x0-DG*.6,y-hgt/2,DG*1.2,hgt)}X.restore()}
// tercio inferior de motion con borde de tinta
function lower(t,t0,x,y,a,b,w){const p=ex(P(t,t0,.6));if(p<=0)return;const h1=74*U,h2=50*U;X.save();
  X.fillStyle=C.ti;X.fillRect(x+10*U,y+10*U,w*p,h1+h2);X.fillStyle=C.cian;X.fillRect(x,y,w*p,h1);X.fillStyle='#fff';X.fillRect(x,y+h1,w*ex(P(t,t0+.15,.6)),h2);
  X.lineWidth=7*U;X.strokeStyle=C.ti;X.strokeRect(x,y,w*p,h1+h2);X.beginPath();X.rect(x,y,w*p,h1+h2);X.clip();
  mtxt(a,x+28*U-(1-p)*60*U,y+h1/2+3*U,46*U,{al:'left',c:C.ti,ls:2});X.font=`700 ${32*U}px Neue`;X.fillStyle=C.marino;X.textBaseline='middle';X.textAlign='left';X.fillText(b,x+28*U,y+h1+h2/2+2*U);X.restore()}
// cinta de noticias (siempre visible desde 0.6 s)
const TICK='SIGUE LAS NOTICIAS POR LAS REDES SOCIALES DE UNE VISIÓN   ★   /UNEVISION   ★   ';
function ticker(t){const k=ex(P(t,.6,.6))*(1-ss(P(t,18.6,.5)));if(k<=0)return;const h=L(70,78)*U,y=L(H-h-26*U,H-400*U);X.save();X.globalAlpha=1;
  X.translate(0,(1-k)*200*U);X.fillStyle=C.ti;X.fillRect(0,y+8*U,W,h);X.fillStyle=C.am;X.fillRect(0,y,W,h);X.lineWidth=6*U;X.strokeStyle=C.ti;X.strokeRect(-10,y,W+20,h);
  const lw=L(330,280)*U;X.fillStyle=C.ro;X.fillRect(0,y,lw,h);X.strokeRect(-10,y,lw+10,h);ink('NOTICIAS',lw/2,y+h/2+3*U,h*.7,{c:'#fff',d:4,lw:6});
  X.beginPath();X.rect(lw,y,W-lw,h);X.clip();const sz=h*.5;const tw=mwA(TICK,sz,3);let x=lw+20*U-((t*230*U)%tw);while(x<W){mtxt(TICK,x,y+h/2+2*U,sz,{al:'left',c:C.ti,ls:3});x+=tw}X.restore()}
function bug(t){const a=ss(P(t,.8,.5))*(1-ss(P(t,15.6,.3)));if(a<=0)return;const w=L(150,160)*U;X.save();X.globalAlpha=a;logoSticker(W-w/2-L(50,50)*U,L(70,300)*U,w*.8,0,1);X.restore()}
// periódico de cómic
